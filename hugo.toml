baseURL = 'https://www.vishalbhoriwal.me/'
title    = "Vishal Bhoriwal"
author   = "Vishal Bhoriwal"
theme    = 'hugo-bearblog'

enableRobotsTXT = true

# Bear Blog style: disable taxonomy kinds to keep URLs clean
disableKinds = ["taxonomy"]
ignoreErrors = ["error-disable-taxonomy"]

[params]
  hideMadeWithLine = true
  favicon         = "/favicon.svg"
  description    = "Thoughts on software, tech and life by Vishal Bhoriwal."
  author         = "Vishal Bhoriwal"
  dateFormat     = "2006-01-02"
  enablePostNavigator = true

  # SEO / Social
  images         = ["/images/og-default.png"]

[markup]
  [markup.highlight]
    codeFences = false

[sitemap]
  changefreq = "monthly"
  filename   = "sitemap.xml"
  priority   = 0.5
