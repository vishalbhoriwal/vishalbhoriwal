<style>
  #theme-toggle:hover {
    opacity: 0.7;
  }
  body.dark-theme {
    --background-color: #15171a;
    --heading-color: #ffffff;
    --text-color: #c5d2d9;
    --muted-color: #7c8b93;
    --border-color: #2b2f33;
    --link-color: #ffffff;
    --visited-color: #ffffff;
    --blockquote-color: #ffffff;
  }

  body.light-theme {
    --background-color: #fff;
    --heading-color: #15171a;
    --text-color: #394047;
    --muted-color: #738a94;
    --border-color: #eaeef0;
    --link-color: #15171a;
    --visited-color: #15171a;
    --blockquote-color: #15171a;
  }

  #theme-toggle:hover {
    opacity: 0.7;
  }

  /* Code block container (Prism.js handles token colors) */
  .highlight,
  pre[class*="language-"] {
    border: 1px solid rgba(128, 128, 128, 0.25);
    border-radius: 3px;
    margin-block-start: 1em;
    margin-block-end: 1em;
    overflow-x: auto;
  }

  pre[class*="language-"] {
    padding: 0.85em 1em !important;
    line-height: 1.5;
    font-size: 0.8em !important;
  }

  code {
    background-color: rgba(128, 128, 128, 0.15);
    font-family: monospace;
    font-size: 0.85em;
    padding: 2px;
    border-radius: 3px;
  }

  pre[class*="language-"] code {
    background-color: transparent !important;
    padding: 0 !important;
    font-size: inherit !important;
  }
</style>

<!-- Prism.js syntax highlighting (theme swapped by the dark/light toggle below) -->
<link rel="stylesheet" id="prism-theme"
  href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css"
  media="print" onload="this.media='all'">

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var btn = document.getElementById('theme-toggle');
    var prismTheme = document.getElementById('prism-theme');
    var stored = localStorage.getItem('theme');
    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    var isDark = stored === 'dark' || (!stored && prefersDark);

    var PRISM_DARK = 'https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css';
    var PRISM_LIGHT = 'https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css';

    function applyTheme(dark) {
      prismTheme.media = 'all';
      if (dark) {
        document.body.classList.add('dark-theme');
        document.body.classList.remove('light-theme');
        btn.title = 'Switch to light mode';
        prismTheme.href = PRISM_DARK;
      } else {
        document.body.classList.add('light-theme');
        document.body.classList.remove('dark-theme');
        btn.title = 'Switch to dark mode';
        prismTheme.href = PRISM_LIGHT;
      }
    }

    applyTheme(isDark);

    btn.addEventListener('click', function (e) {
      e.preventDefault();
      isDark = !isDark;
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      applyTheme(isDark);
    });
  });
</script>

<!-- Canonical URL -->
<link rel="canonical" href="{{ .Permalink }}">

<!-- Author -->
<meta name="author" content="{{ with .Params.author }}{{ . }}{{ else }}{{ .Site.Params.author }}{{ end }}">

<!-- Structured Data (JSON-LD) -->
{{ partial "structured_data.html" . }}

<!-- Explicit robots directive -->
{{ if .Params.noindex }}
<meta name="robots" content="noindex, nofollow">
{{ else }}
<meta name="robots" content="index, follow">
{{ end }}
