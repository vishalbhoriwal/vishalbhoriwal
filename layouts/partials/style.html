<style>
  :root {
    --width: 720px;
    --wide: 1100px;
    --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
    --font-secondary: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
    --font-scale: 1.1em;
    --accent: #ff572f;
    --background-color: #fff;
    --heading-color: #15171a;
    --text-color: #394047;
    --muted-color: #738a94;
    --border-color: #eaeef0;
    --link-color: #15171a;
    --visited-color: #15171a;
    --blockquote-color: #15171a;
  }

  * {
    box-sizing: border-box;
  }

  body {
    font-family: var(--font-secondary);
    font-size: var(--font-scale);
    margin: 0;
    padding: 0;
    text-align: left;
    background-color: var(--background-color);
    word-wrap: break-word;
    overflow-wrap: break-word;
    line-height: 1.65;
    color: var(--text-color);
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, h4, h5, h6 {
    font-family: var(--font-main);
    color: var(--heading-color);
    line-height: 1.2;
    letter-spacing: -0.02em;
    font-weight: 700;
  }

  a {
    color: var(--link-color);
    cursor: pointer;
    text-decoration: none;
  }

  a:hover {
    color: var(--accent);
  }

  strong, b {
    color: var(--heading-color);
  }

  button {
    margin: 0;
    cursor: pointer;
  }

  time {
    font-style: normal;
    color: var(--muted-color);
  }

  table {
    width: 100%;
  }

  hr {
    border: 0;
    border-top: 1px solid var(--border-color);
    margin: 2em 0;
  }

  img {
    max-width: 100%;
    border-radius: 6px;
  }

  blockquote {
    border-left: 3px solid var(--accent);
    color: var(--blockquote-color);
    padding-left: 20px;
    margin-left: 0;
    font-style: italic;
  }

  /* ---------- Layout wrappers ---------- */
  .gh-head {
    border-bottom: 1px solid var(--border-color);
  }

  .site-wrap {
    max-width: var(--width);
    margin: 0 auto;
    padding: 0 5vw;
  }

  main {
    min-height: 60vh;
  }

  /* ---------- Header ---------- */
  header.gh-head {
    padding: 0;
  }

  .gh-head-inner {
    max-width: var(--width);
    margin: 0 auto;
    padding: 22px 5vw;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
  }

  .gh-head-logo {
    font-family: var(--font-main);
    font-weight: 800;
    font-size: 1.35em;
    letter-spacing: -0.03em;
    color: var(--heading-color);
  }

  .gh-head-logo:hover {
    color: var(--heading-color);
  }

  .gh-head-menu {
    display: flex;
    align-items: center;
    gap: 22px;
  }

  .gh-head-menu a {
    color: var(--text-color);
    font-size: 0.82em;
    font-weight: 500;
  }

  .gh-head-menu a:hover {
    color: var(--accent);
  }

  #theme-toggle {
    font-size: 0.82em;
    font-weight: 500;
  }

  /* ---------- Home / prose ---------- */
  .prose {
    padding-top: 40px;
    padding-bottom: 40px;
  }

  .prose h1 {
    font-size: 2.4em;
    margin-bottom: 0.3em;
  }

  main {
    line-height: 1.7;
  }

  /* ---------- Calendar feed (Dawn signature) ---------- */
  ul.blog-posts {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  ul.blog-posts li {
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 26px 0;
    border-bottom: 1px solid var(--border-color);
  }

  ul.blog-posts li:first-child {
    border-top: 1px solid var(--border-color);
  }

  .feed-calendar {
    flex: 0 0 52px;
    text-align: center;
    line-height: 1;
  }

  .feed-calendar-day {
    font-family: var(--font-main);
    font-size: 1.9em;
    font-weight: 800;
    color: var(--heading-color);
    letter-spacing: -0.03em;
  }

  .feed-calendar-month {
    text-transform: uppercase;
    font-size: 0.72em;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--muted-color);
    margin-top: 4px;
  }

  .feed-title {
    flex: 1;
    font-size: 1.15em;
    font-weight: 700;
    margin: 0;
  }

  .feed-title a {
    color: var(--heading-color);
  }

  .feed-title a:hover {
    color: var(--accent);
  }

  .feed-arrow {
    flex: 0 0 auto;
    color: var(--muted-color);
    display: flex;
    align-items: center;
  }

  ul.blog-posts li:hover .feed-arrow {
    color: var(--accent);
  }

  ul.blog-posts li a:visited {
    color: inherit;
  }

  /* ---------- Single post ---------- */
  .post-header {
    padding-top: 30px;
    margin-bottom: 30px;
  }

  .post-header h1 {
    font-size: 2.4em;
    margin: 0 0 0.4em;
  }

  .post-meta {
    color: var(--muted-color);
    font-size: 0.9em;
  }

  .post-tags a {
    color: var(--muted-color);
    font-size: 0.85em;
    margin-right: 10px;
  }

  .post-tags a:hover {
    color: var(--accent);
  }

  /* ---------- Footer ---------- */
  footer.gh-foot {
    border-top: 1px solid var(--border-color);
    margin-top: 60px;
    padding: 40px 0;
    text-align: center;
    color: var(--muted-color);
    font-size: 0.85em;
  }

  footer.gh-foot a {
    color: var(--muted-color);
  }

  footer.gh-foot a:hover {
    color: var(--accent);
  }

  /* ---------- Code ---------- */
  .highlight, .code {
    border-radius: 6px;
    margin-block-start: 1em;
    margin-block-end: 1em;
    overflow-x: auto;
  }

  .highlight pre, .code pre {
    min-width: 100%;
    width: max-content;
  }

  @media (max-width: 600px) {
    .gh-head-menu { gap: 14px; }
    .prose h1, .post-header h1 { font-size: 1.9em; }
  }
</style>
