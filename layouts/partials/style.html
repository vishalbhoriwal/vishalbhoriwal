<style>
  :root {
    --width: 800px;
    --post-width: 820px;
    --wide: 1200px;
    --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
    --font-secondary: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
    --font-scale: 1.05em;
    --accent: #ff572f;
    --background-color: #fff;
    --heading-color: #15171a;
    --text-color: #394047;
    --muted-color: #94a2ab;
    --border-color: #e7ebee;
    --link-color: #15171a;
    --visited-color: #15171a;
    --blockquote-color: #15171a;
  }

  * { box-sizing: border-box; }

  html, body { overflow-x: hidden; max-width: 100%; }

  body {
    font-family: var(--font-secondary);
    font-size: var(--font-scale);
    margin: 0;
    padding: 0;
    text-align: left;
    background-color: var(--background-color);
    word-wrap: break-word;
    overflow-wrap: break-word;
    line-height: 1.65;
    color: var(--text-color);
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, h4, h5, h6 {
    font-family: var(--font-main);
    color: var(--heading-color);
    line-height: 1.25;
    letter-spacing: -0.02em;
    font-weight: 700;
  }

  a { color: var(--link-color); cursor: pointer; text-decoration: none; }
  a:hover { color: var(--accent); }

  /* Inline links inside article/page content stand out */
  .prose content a,
  .prose p a,
  .prose li a,
  .cover-description a,
  content a {
    color: var(--accent);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .prose content a:hover,
  .prose p a:hover,
  .prose li a:hover,
  content a:hover {
    text-decoration: none;
    opacity: 0.8;
  }
  strong, b { color: var(--heading-color); }
  button { margin: 0; cursor: pointer; font-family: inherit; }
  time { font-style: normal; color: var(--muted-color); }
  table { width: 100%; }
  hr { border: 0; border-top: 1px solid var(--border-color); margin: 2em 0; }
  img { max-width: 100%; height: auto; border-radius: 4px; }
  blockquote {
    border-left: 3px solid var(--accent);
    color: var(--blockquote-color);
    padding-left: 20px; margin-left: 0; font-style: italic;
  }

  /* ---------- Wrappers ---------- */
  .gh-outer { padding: 0 max(20px, 4vw); }
  .gh-inner { max-width: var(--wide); margin: 0 auto; }
  .site-wrap { max-width: var(--width); margin: 0 auto; padding: 0 max(20px, 4vw); }
  .site-wrap--post { max-width: var(--post-width); }
  main { min-height: 50vh; }

  /* ---------- Header (full width) ---------- */
  .gh-head { padding-top: 26px; padding-bottom: 26px; }
  .gh-head-inner {
    display: flex; align-items: center; gap: 30px;
  }
  .gh-head-logo {
    font-family: var(--font-main);
    font-weight: 800; font-size: 1.55em;
    letter-spacing: -0.03em; color: var(--heading-color);
  }
  .gh-head-logo:hover { color: var(--heading-color); }
  .gh-head-menu { display: flex; align-items: center; justify-content: center; gap: 30px; flex: 1; }
  .gh-head-menu a { color: var(--heading-color); font-size: 0.82em; font-weight: 500; }
  .gh-head-menu a:hover { color: var(--accent); }
  .gh-head-actions { display: flex; align-items: center; gap: 22px; }
  .gh-head-actions a { color: var(--heading-color); font-size: 0.82em; font-weight: 500; }
  .gh-head-actions a:hover { color: var(--accent); }
  .gh-icon-btn {
    background: none; border: none; padding: 0; color: var(--heading-color);
    display: inline-flex; align-items: center;
  }
  .gh-icon-btn:hover { color: var(--accent); }
  .gh-burger { display: none; }
  /* sun/moon toggle: show moon in light mode, sun in dark mode */
  body.light-theme .icon-sun { display: none; }
  body.dark-theme .icon-moon { display: none; }
  #theme-toggle { font-size: 0.82em; font-weight: 500; }

  /* ---------- Cover / hero ---------- */
  .cover { padding: 55px 0 30px; text-align: center; }
  .cover-icon img { width: 90px; height: 90px; border-radius: 50%; }
  .cover-title { font-size: 2em; margin: 20px 0 0; }
  .cover-description {
    max-width: 620px; margin: 22px auto 0;
    font-size: 1.35em; color: var(--text-color); line-height: 1.4;
  }
  .cover-cta { margin-top: 30px; display: flex; gap: 12px; justify-content: center; }
  .button {
    padding: 11px 22px; border-radius: 4px; font-weight: 600;
    font-size: 0.85em; border: 1px solid var(--accent);
    background: var(--accent); color: #fff;
  }
  .button:hover { opacity: 0.9; }
  .button-secondary {
    background: transparent; color: var(--heading-color);
    border: 1px solid var(--border-color);
  }
  .button-secondary:hover { border-color: var(--heading-color); }

  /* ---------- Prose (home markdown / posts) ---------- */
  .prose { padding-top: 40px; padding-bottom: 20px; }
  .prose h1 { font-size: 2.3em; margin-bottom: 0.3em; }
  main { line-height: 1.7; }

  /* ---------- Featured ---------- */
  .featured-wrapper { padding-top: 40px; padding-bottom: 10px; }
  .featured-head {
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border-color); padding-bottom: 14px;
  }
  .featured-title {
    text-transform: uppercase; font-size: 0.8em; letter-spacing: 0.08em;
    font-weight: 700; margin: 0; color: var(--heading-color);
  }
  .featured-feed {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 30px; margin-top: 34px;
  }
  .featured .featured-img {
    width: 100%; aspect-ratio: 3/2; object-fit: cover; border-radius: 4px;
  }
  .featured h3 { font-size: 1.2em; margin: 16px 0 0; line-height: 1.3; }
  .featured h3 a { color: var(--heading-color); }
  .featured h3 a:hover { color: var(--accent); }

  /* ---------- Feed (Dawn signature list) ---------- */
  ul.blog-posts { list-style: none; padding: 0; margin: 40px 0 0; }
  ul.blog-posts li {
    display: flex; align-items: center; gap: 26px;
    padding: 22px 4px; border-bottom: 1px solid var(--border-color);
  }
  ul.blog-posts li:first-child { border-top: 1px solid var(--border-color); }
  .feed-date {
    flex: 0 0 58px; text-align: left;
    color: var(--accent); font-size: 0.72em; font-weight: 700;
    letter-spacing: 0.03em; text-transform: uppercase;
  }
  .feed-title {
    flex: 1; font-size: 1.15em; font-weight: 600; margin: 0; line-height: 1.35;
  }
  .feed-title a { color: var(--heading-color); }
  .feed-title a:hover { color: var(--accent); }
  .feed-right {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    color: var(--muted-color); font-size: 0.85em; white-space: nowrap;
  }
  .feed-star { color: #f5c518; display: inline-flex; }

  .load-more { text-align: center; margin: 45px 0; }

  /* ---------- Single post ---------- */
  .post-header { padding-top: 30px; margin-bottom: 30px; text-align: center; }
  .post-header h1 { font-size: 2.4em; margin: 0 0 0.4em; }
  .post-meta { color: var(--muted-color); font-size: 0.9em; }
  .post-cover {
    width: 100%; aspect-ratio: 2/1; object-fit: cover;
    border-radius: 6px; margin: 0 0 36px; display: block;
    height: auto;
  }
  .post-tags a { color: var(--muted-color); font-size: 0.85em; margin-right: 10px; }
  .post-tags a:hover { color: var(--accent); }

  /* ---------- Footer ---------- */
  footer.gh-foot {
    border-top: 1px solid var(--border-color);
    margin-top: 50px; padding-top: 40px; padding-bottom: 40px;
    color: var(--muted-color); font-size: 0.82em;
  }
  .gh-foot-inner {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  }
  .gh-copyright { text-align: left; }
  .gh-foot-center { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .gh-social-links { display: flex; gap: 16px; }
  .gh-social-links a { color: var(--heading-color); display: inline-flex; }
  .gh-social-links a:hover { color: var(--accent); }
  .gh-foot-menu { display: flex; gap: 8px; }
  .gh-foot-menu a { color: var(--muted-color); }
  .gh-foot-menu a:hover { color: var(--accent); }
  .gh-powered-by { text-align: right; }
  footer.gh-foot a { color: var(--muted-color); }
  footer.gh-foot a:hover { color: var(--accent); }

  /* ---------- Code ---------- */
  .highlight, .code {
    border-radius: 4px; margin-block-start: 1em; margin-block-end: 1em; overflow-x: auto;
  }
  .highlight pre, .code pre { max-width: 100%; overflow-x: auto; }

  /* Copy button on code blocks */
  pre.has-copy { position: relative; }
  .copy-btn {
    position: absolute; top: 8px; right: 8px;
    padding: 4px 10px; font-size: 12px; font-weight: 600;
    font-family: var(--font-main);
    color: var(--text-color); background: var(--background-color);
    border: 1px solid var(--border-color); border-radius: 4px;
    cursor: pointer; opacity: 0; transition: opacity 0.15s ease, background 0.15s ease;
    line-height: 1;
  }
  pre.has-copy:hover .copy-btn,
  .copy-btn:focus { opacity: 0.95; }
  .copy-btn:hover { border-color: var(--muted-color); }
  .copy-btn.copied {
    color: #fff; background: var(--accent); border-color: var(--accent); opacity: 1;
  }
  @media (hover: none) {
    .copy-btn { opacity: 1; }
  }

  @media (max-width: 900px) {
    .featured-feed { grid-template-columns: repeat(2, 1fr); gap: 24px; }
  }

  @media (max-width: 700px) {
    :root { --font-scale: 1em; }
    .gh-outer, .site-wrap { padding-left: 22px; padding-right: 22px; }
    .gh-head { padding-top: 18px; padding-bottom: 18px; }
    .gh-head-inner { flex-wrap: wrap; gap: 16px; }
    .gh-head-logo { font-size: 1.35em; }
    .gh-burger { display: inline-flex; }
    /* collapsible menu */
    .gh-head-menu {
      order: 3; flex-basis: 100%; flex-direction: column;
      align-items: flex-start; justify-content: flex-start; gap: 4px;
      max-height: 0; overflow: hidden;
      transition: max-height 0.25s ease;
    }
    .gh-head-menu.is-open { max-height: 400px; padding-top: 6px; }
    .gh-head-menu a { padding: 8px 0; font-size: 1em; width: 100%; }
    .gh-head-actions { margin-left: auto; }

    .cover { padding: 36px 0 24px; }
    .cover-title { font-size: 1.7em; }
    .cover-description { font-size: 1.1em; }
    .cover-cta { flex-wrap: wrap; }

    .featured-wrapper { padding-top: 28px; padding-bottom: 6px; }
    .featured-feed { grid-template-columns: 1fr; gap: 26px; margin-top: 24px; }
    .featured .featured-img { aspect-ratio: 16/9; }

    .prose h1, .post-header h1 { font-size: 1.9em; }
    .post-header { text-align: left; }

    /* feed becomes stacked: date on top, read below title */
    ul.blog-posts { margin-top: 28px; }
    ul.blog-posts li {
      flex-wrap: wrap; gap: 4px 14px; align-items: baseline; padding: 18px 2px;
    }
    .feed-date { flex: 0 0 auto; order: 1; }
    .feed-right { order: 2; margin-left: auto; }
    .feed-title { order: 3; flex-basis: 100%; font-size: 1.08em; }

    .gh-foot-inner { grid-template-columns: 1fr; gap: 18px; text-align: center; }
    .gh-copyright, .gh-powered-by { text-align: center; }
  }
</style>
