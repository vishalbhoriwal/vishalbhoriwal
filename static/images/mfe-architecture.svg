<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="monospace">
  <rect x="0" y="0" width="1200" height="620" fill="#ffffff" rx="6"/>

  <!-- Title -->
  <text x="600" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e1e1e">Micro Frontend Architecture</text>

  <!-- User Browser -->
  <rect x="520" y="60" width="160" height="50" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
  <text x="600" y="90" text-anchor="middle" font-size="14" fill="#1e1e1e">User Browser</text>

  <!-- Arrow: Browser -> Shell -->
  <line x1="600" y1="110" x2="600" y2="150" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Shell Application -->
  <rect x="80" y="150" width="1040" height="90" fill="#f1f3f5" stroke="#1e1e1e" stroke-width="2"/>
  <text x="600" y="180" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e1e1e">Shell Application (Host)</text>
  <text x="600" y="205" text-anchor="middle" font-size="12" fill="#495057">— Client-Side Router —</text>

  <!-- Module federation label -->
  <text x="600" y="257" text-anchor="middle" font-size="11" fill="#868e96">loaded via Module Federation at runtime</text>

  <!-- Arrows: Shell -> MFEs -->
  <line x1="220" y1="240" x2="220" y2="320" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="240" x2="460" y2="320" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="240" x2="700" y2="320" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="940" y1="240" x2="940" y2="320" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- MFE boxes -->
  <rect x="120" y="320" width="200" height="80" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
  <text x="220" y="352" text-anchor="middle" font-size="13" fill="#1e1e1e">MFE: Header / Nav</text>
  <text x="220" y="374" text-anchor="middle" font-size="12" fill="#495057">Team A</text>

  <rect x="360" y="320" width="200" height="80" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
  <text x="460" y="352" text-anchor="middle" font-size="13" fill="#1e1e1e">MFE: Dashboard</text>
  <text x="460" y="374" text-anchor="middle" font-size="12" fill="#495057">Team B</text>

  <rect x="600" y="320" width="200" height="80" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
  <text x="700" y="352" text-anchor="middle" font-size="13" fill="#1e1e1e">MFE: Cart / Checkout</text>
  <text x="700" y="374" text-anchor="middle" font-size="12" fill="#495057">Team C</text>

  <rect x="840" y="320" width="200" height="80" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
  <text x="940" y="352" text-anchor="middle" font-size="13" fill="#1e1e1e">MFE: Profile</text>
  <text x="940" y="374" text-anchor="middle" font-size="12" fill="#495057">Team D</text>

  <!-- Arrows: MFEs -> Shared -->
  <line x1="220" y1="400" x2="220" y2="480" stroke="#868e96" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <line x1="460" y1="400" x2="460" y2="480" stroke="#868e96" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <line x1="700" y1="400" x2="700" y2="480" stroke="#868e96" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <line x1="940" y1="400" x2="940" y2="480" stroke="#868e96" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- Shared foundation -->
  <rect x="80" y="480" width="1040" height="70" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
  <text x="600" y="521" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e1e1e">Shared: Design System / Auth / Utilities</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1e1e1e"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#868e96"/>
    </marker>
  </defs>
</svg>
